name: Build Android APK

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Show Android SDK location
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la "$ANDROID_HOME/cmdline-tools" || true

      - name: Install Android platform
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | head -n 1)
          fi
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare uploaded original fox artwork
        run: |
          test -s fox_original.png
          mkdir -p app/src/main/res/drawable
          cp fox_original.png app/src/main/res/drawable/fox_original.png

      - name: Validate all 300 lessons and 30 stories
        run: python3 scripts/validate_content.py

      - name: Check offline features and progress compatibility
        run: python3 scripts/validate_app_contract.py

      - name: Validate word repetition policy and grammar curriculum
        run: |
          python3 scripts/validate_curriculum.py
          python3 -m unittest discover -s scripts -p 'test_curriculum.py'

      - name: Build and validate bundled offline reference
        run: |
          python3 scripts/build_offline_library.py
          python3 scripts/validate_beginner.py

      - name: Compile debug APK
        env:
          LINGUAFREE_CLASSROOM_URL: ${{ vars.LINGUAFREE_CLASSROOM_URL }}
        run: gradle --no-daemon --stacktrace testDebugUnitTest assembleDebug

      - name: Build persistently signed release when signing secrets exist
        if: github.event_name != 'pull_request'
        env:
          LINGUAFREE_CLASSROOM_URL: ${{ vars.LINGUAFREE_CLASSROOM_URL }}
          LINGUAFREE_KEYSTORE_B64: ${{ secrets.LINGUAFREE_KEYSTORE_B64 }}
          LINGUAFREE_STORE_PASSWORD: ${{ secrets.LINGUAFREE_STORE_PASSWORD }}
          LINGUAFREE_KEY_ALIAS: ${{ secrets.LINGUAFREE_KEY_ALIAS }}
          LINGUAFREE_KEY_PASSWORD: ${{ secrets.LINGUAFREE_KEY_PASSWORD }}
        run: |
          if [ -z "$LINGUAFREE_KEYSTORE_B64" ] || [ -z "$LINGUAFREE_STORE_PASSWORD" ] || [ -z "$LINGUAFREE_KEY_ALIAS" ] || [ -z "$LINGUAFREE_KEY_PASSWORD" ]; then
            echo "Release signing secrets missing: skipping signed APK."
            exit 0
          fi
          export LINGUAFREE_KEYSTORE_PATH="$RUNNER_TEMP/linguafree-release.jks"
          printf '%s' "$LINGUAFREE_KEYSTORE_B64" | base64 --decode > "$LINGUAFREE_KEYSTORE_PATH"
          chmod 600 "$LINGUAFREE_KEYSTORE_PATH"
          gradle --no-daemon assembleRelease
          mkdir -p signed-release
          cp app/build/outputs/apk/release/*-release.apk signed-release/

      - name: Upload signed release APK (if configured)
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: LinguaFree-signed-release-apk
          path: signed-release/*.apk
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LinguaFree-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error


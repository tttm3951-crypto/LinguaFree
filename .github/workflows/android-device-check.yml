name: Android device checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare original artwork
        run: |
          mkdir -p app/src/main/res/drawable
          cp fox_original.png app/src/main/res/drawable/fox_original.png
      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test on Android 35 with a small screen and enlarged text
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb shell wm size 1080x1920
            adb shell wm density 480
            adb shell settings put system font_scale 1.3
            gradle --no-daemon connectedDebugAndroidTest
      - name: Save device test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LinguaFree-android-device-report
          path: app/build/reports/androidTests/
          if-no-files-found: ignore

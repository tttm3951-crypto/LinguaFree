name: Android device checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: device-${{ github.ref }}
  cancel-in-progress: true
jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build bundled offline reference
        run: python3 scripts/build_offline_library.py
      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: UI tests on Android 34 (small screen, large text, offline)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: bash scripts/device_checks.sh
      - name: Explain test failures
        if: failure()
        run: python3 scripts/ci/annotate_test_failures.py
      - name: Save device test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LinguaFree-android-device-report
          path: |
            **/build/reports/androidTests/
            **/build/outputs/androidTest-results/
            device-artifacts/
          if-no-files-found: ignore

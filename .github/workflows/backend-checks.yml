name: Classroom server checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test access, retries, revocation, retention and rate limiting
        run: node --test backend/cloudflare-worker/test/*.test.js
      - name: Validate the Cloudflare build without publishing
        working-directory: backend/cloudflare-worker
        run: |
          sed -i 's/REPLACE_WITH_KV_NAMESPACE_ID/00000000000000000000000000000000/' wrangler.toml
          npx --yes wrangler@4 deploy --dry-run

name = "linguafree-classroom"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
ALLOW_CLASSROOM_CREATION = "false"

[[durable_objects.bindings]]
name = "CLASSROOMS"
class_name = "Classroom"

[[migrations]]
tag = "v1-classroom-storage"
new_sqlite_classes = ["Classroom"]

[[ratelimits]]
name = "CLASSROOM_RATE_LIMITER"
namespace_id = "10017"
simple = { limit = 60, period = 60 }

[[kv_namespaces]]
binding = "CLASSROOM_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

